# Deploys to Google Cloud Run.
# Every push to main -> staging (automatic).
# Production -> run this workflow manually (Actions tab -> Deploy -> Run workflow ->
# environment: production). Protect the "production" GitHub Environment
# with required reviewers so someone must approve it.
#
# Setup: docs/07-deployment.md (Workload Identity Federation, no keys stored in GitHub).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    permissions:
      contents: read
      id-token: write # needed for keyless login to Google Cloud
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build, migrate, deploy, health-check
        run: ./scripts/deploy.sh "${{ github.event.inputs.environment || 'staging' }}" "${GITHUB_SHA:0:7}"
