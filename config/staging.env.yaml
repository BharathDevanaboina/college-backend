# Non-secret settings for the staging Cloud Run service.
# See SECRETS in config/staging.deploy.env. Replace every REPLACE_ME value once.
APP_ENV: "staging"
LOG_LEVEL: "INFO"
ENABLED_MODULES: "all"
GCP_PROJECT_ID: "college-staging"
CORS_ALLOWED_ORIGINS: "REPLACE_ME_https://your-site-domain"

# Cloud SQL (PostgreSQL), connected through the Cloud SQL socket
CLOUD_SQL_CONNECTION_NAME: "college-staging:asia-south1:college-db"
DB_NAME: "college"
DB_USER: "college_app"

# Firebase
AUTH_MODE: "firebase"
REQUIRE_ADMIN_MFA: "true"
APP_CHECK_ENABLED: "true"
OTP_MAX_AGE_SECONDS: "600"
DELETE_FIREBASE_PHONE_USER: "true"

# Cloud Storage for Firebase
STORAGE_BACKEND: "firebase"
STORAGE_BUCKET: "college-staging.firebasestorage.app"

# Google Sheets (share the spreadsheet with the runtime service account)
SHEETS_BACKEND: "google"
SHEETS_SPREADSHEET_ID: "REPLACE_ME_spreadsheet_id"
SHEETS_TAB_BROCHURE: "Brochure Downloads"
SHEETS_TAB_EXAM: "Exam Registrations"

# Cloud Scheduler -> /internal/lead-sync/flush
INTERNAL_AUTH_MODE: "oidc"
INTERNAL_OIDC_AUDIENCE: "REPLACE_ME_cloud_run_service_url"
INTERNAL_ALLOWED_SERVICE_ACCOUNTS: "college-scheduler@college-staging.iam.gserviceaccount.com"

# Exam
EXAM_DURATION_MINUTES: "150"
EXAM_SUBMIT_GRACE_SECONDS: "300"
