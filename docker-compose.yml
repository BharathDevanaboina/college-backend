# Local development: PostgreSQL + the API, with fake Firebase / Google Sheets.
# docker compose up --build
# API: http://localhost:8000/docs  Database: localhost:5432 (college / college)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: college
      POSTGRES_PASSWORD: college
      POSTGRES_DB: college
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U college -d college"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      LOG_LEVEL: INFO
      PORT: "8000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: college
      DB_PASSWORD: college
      DB_NAME: college
      AUTH_MODE: fake
      APP_CHECK_ENABLED: "false"
      STORAGE_BACKEND: local
      LOCAL_STORAGE_DIR: /app/var/storage
      PUBLIC_BASE_URL: http://localhost:8000
      SHEETS_BACKEND: fake
      FAKE_SHEETS_DIR: /app/var/sheets
      INTERNAL_AUTH_MODE: token
      INTERNAL_TASK_TOKEN: local-internal-token-change-me-0123456789
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    volumes:
      - ./app:/app/app:ro
      - appdata:/app/var
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app"

volumes:
  pgdata:
  appdata:
